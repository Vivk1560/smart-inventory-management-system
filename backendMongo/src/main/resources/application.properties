spring.config.import=optional:file:../.env[.properties]
spring.application.name=SmartInventory-MongoDB

server.port=8082

spring.data.mongodb.uri=${MONGO_URI}

spring.data.mongodb.heartbeat-frequency=30s
spring.data.mongodb.server-selection-timeout=60s
spring.data.mongodb.socket-timeout=20000
spring.data.mongodb.connect-timeout=15000

logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.web=INFO
logging.level.org.mongodb.driver.cluster=INFO